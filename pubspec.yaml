name: coach_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  device_preview: ^1.3.1
  dio: ^5.8.0+1
  crypto: ^3.0.6
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_fonts: ^6.3.0
  intl: ^0.20.2
  syncfusion_flutter_charts: ^30.1.42
  table_calendar: ^3.1.3
  image_picker: ^1.0.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: 10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/subtract.png"
  min_sdk_android: 21
  remove_alpha_ios: true
