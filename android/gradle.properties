org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Fuerza JDK 17 de Android Studio para builds de Gradle (evita usar JAVA_HOME global incorrecto).
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# Workaround para errores de loopback/daemon en algunos entornos Windows.
org.gradle.daemon=false
# Workaround para fallo de caches incrementales Kotlin cuando proyecto y Pub cache
# están en discos distintos (ej: D:\ proyecto vs C:\Users\...\Pub\Cache).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.caching.enabled=false
